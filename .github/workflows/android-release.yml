name: Android v1.1 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: key-bolt-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Test and build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Run unit tests and build APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest assembleDebug

      - name: Name APK for distribution
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Key-Bolt.apk

      - name: Verify APK output
        run: |
          test -s app/build/outputs/apk/debug/Key-Bolt.apk
          file app/build/outputs/apk/debug/Key-Bolt.apk
          sha256sum app/build/outputs/apk/debug/Key-Bolt.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: Key-Bolt-android-apk
          path: app/build/outputs/apk/debug/Key-Bolt.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish v1.0 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1
          target_commitish: ${{ github.sha }}
          name: Key-Bolt v1.1
          body: |
            ## Key-Bolt v1.1 — Android installable test build

            **CUSTOM. FAST. BOLT.**

            This APK is built by GitHub Actions after Android tests and build succeed.
            It uses the standard Android debug key for direct installation/testing.
            It is not signed with a private production release key and is not a Google Play upload.
            Review the repository README and feature matrix for current capabilities and limitations.
          prerelease: true
          files: app/build/outputs/apk/debug/Key-Bolt.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
